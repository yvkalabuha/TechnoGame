# RHMS_OFF data set (spec slice-jet-aviation.md v0.19 §1.1, F32): the scenario of D1 (before step 3 of the start rule R-H-MS', #155/#159).
# It overrides jet_slice_1945 of mod core. It violates validator S-2 (yield(t0) of 49/54 and others < 0.7) by design: use it only with
# SliceRunConfig.SkipStartValidation for the before/after print; never in a calibration or experiment run.
# Start scenario 1945-09 of the jet slice (TASK-0011 scenario_1945.md; spec slice-jet-aviation.md §1.1).
# Rules R-* are defined in docs/research/data/jet-slice/scenario_1945.md §1 (written before the numbers).
# Actor order is data: it fixes the actor index in RNG keys (spec §3.5 A7), so reordering
# changes the scenario hash. Money: budget_index is relative to USA (= 1). Shares are fractions.
kind: scenario
override:
  - id: jet_slice_1945
    start: {year: 1945, month: 9}
    clusters: [MET, CHEM, MECH, AERO]
    disciplines: [aero, prop, metal, chem, mech]
    tech_lead: USA
    # R-MS: known tier-3/4 PRC listed in "mastered" are mastered since t0-6; proc_X(t0) = 3·X½(tier).
    mastered_history: {since_month: -6, proc_x_half_lives: 3}
    # R-AC, R-AREF (product_inputs.md r3 §6, estimated): alloy_cap_a(t0) = floor(alloy_ref_kg·budget_index_a) kg/month
    # (USA 92 300, GBR 22 059, SUN 21 136, FRA 6 461, SWE 2 215); alloy_ref_kg = alloy_kg[G1]·N_ref, N_ref = mature
    # G1 USA buys per month at t0. No direct source for melt capacity 1945-60. Dynamics follow the budget.
    alloy_ref_kg: 92300
    # Design slots per actor (contract §3.1, G4-8): 4 generations × 2 presets + one derived design per platform [assumption].
    max_designs: 12
    # Source or estimation rule of every actor field (spec §1.1 "rule before number").
    # estimated: true = estimated for every actor; per-actor estimates are listed in actor.estimated.
    provenance:
      - {field: gdp_1945, rule: R-GDP, sources: [S1], estimated: false}
      - {field: gdppc_1945, rule: R-H, sources: [S2], estimated: false}
      - {field: budget_index, rule: R-BUD, sources: [S1], estimated: true}
      - {field: growth_pa, rule: R-GRO, sources: [S1], estimated: false}
      - {field: culture_h, rule: R-H, sources: [S2], estimated: true}
      - {field: tooling_m, rule: R-M, sources: [S8, S36], estimated: true}
      - {field: hcap, rule: R-HC, sources: [], estimated: true}
      - {field: w, rule: R-W, sources: [], estimated: true}
      - {field: known, rule: R-KN, sources: [S4, S5, S7, S11, S13], estimated: false}
      - {field: k_d, rule: R-KD, sources: [], estimated: true}
      - {field: k_ind, rule: R-KI, sources: [], estimated: true}
      - {field: mastered, rule: R-MS, sources: [], estimated: true}
      - {field: fleet, rule: R-FL, sources: [], estimated: true}
      - {field: trophy_engineers, rule: R-ENG, sources: [S8, S9, S10, S11], estimated: false}
    actors:
      - id: USA
        class: great
        exposure: 0.5   # spec 8.1 «З» (A43.6): exposure_a of the alloy disruption
        gdp_1945: 2314.67
        gdp_year: 1945
        gdppc_1945: 16478
        budget_index: 1.000
        growth_pa: 0.0299
        # D1 (#133, owner decision): CHEM purity 3.80 -> 4.00 as a scenario estimate (not by R-H-STD-t0: node 45 has no series at t0).
        culture_h:
          MET: {precision: 4.00, purity: 3.80, quality_control: 3.70}
          CHEM: {precision: 4.00, purity: 4.00, quality_control: 3.70}
          MECH: {precision: 4.00, purity: 3.80, quality_control: 3.70}
          AERO: {precision: 4.00, purity: 3.80, quality_control: 3.70}
        tooling_m:
