# Ownership-event lines (RR-0020, ADR-0020 §2.9, #350): the provinces of a set change owner or controller together, so every region lies
# wholly in one set or wholly outside it. The CI check of 'MapBuilder build' fails on a region that crosses a line.
# A set selects provinces by 'adm0' (NE country), 'ids' (a trailing * is a prefix) or 'cuts' ("cut_id:piece" of a cut in spec/20-cuts-*.yaml).
# 'not_drawn' records a line that is not on the map and why (printed by the build).
events:
  - id: kaliningrad_soviet
    date: "1946-04-07"
    rr: C01
    sets:
      - {name: kaliningrad, ids: ["kaliningrad.*"]}
  - id: saar_protectorate
    date: "1947-12-17"
    rr: C02
    sets:
      - {name: saar, ids: ["saar.*"]}
  - id: saar_to_frg
    date: "1957-01-01"
    rr: C02b
    sets:
      - {name: saar, ids: ["saar.*"]}
  - id: frg_founding
    date: "1949-05-23"
    rr: C03
    sets:
      - {name: western_zones, ids: ["germany_us_zone.*", "germany_british_zone.*", "germany_french_zone.*", "germany_us_enclave.*"]}
  - id: frg_sovereignty
    date: "1955-05-05"
    rr: C09
    sets:
      - {name: western_zones, ids: ["germany_us_zone.*", "germany_british_zone.*", "germany_french_zone.*", "germany_us_enclave.*"]}
  - id: gdr_founding
    date: "1949-10-07"
    rr: C05
    sets:
      - {name: soviet_zone, ids: ["germany_soviet_zone.*"]}
  - id: gdr_administration
    date: "1949-10-10"
    rr: C06
    sets:
      - {name: soviet_zone_and_east_berlin, ids: ["germany_soviet_zone.*", "berlin_east.*"]}
  - id: gdr_sovereignty
    date: "1954-03-25"
    rr: C08
    sets:
      - {name: soviet_zone, ids: ["germany_soviet_zone.*"]}
  - id: oder_neisse_zgorzelec
    date: "1950-07-06"
    rr: C07
    sets:
      - {name: former_german_lands, ids: ["poland_former_german.*"]}
  - id: oder_neisse_warsaw
    date: "1970-12-07"
    rr: C07b
    sets:
      - {name: former_german_lands, ids: ["poland_former_german.*"]}
      - {name: kaliningrad, ids: ["kaliningrad.*"]}
  - id: danzig_not_germany
    date: "1945-10-01"
    rr: "C07 and DEBT-0043"
    sets:
      - {name: free_city_of_danzig, ids: ["danzig.*"]}
  - id: berlin_city_split
    date: "1948-11-30"
    rr: C12
    sets:
      - {name: western_sectors, ids: ["berlin_west.*"]}
      - {name: soviet_sector, ids: ["berlin_east.*"]}
  - id: berlin_us_british_french_sectors
    date: "1948-11-30"
    rr: C12
    not_drawn: "the lines between the US, British and French sectors of Berlin are in no PD, CC0 or CC BY source found (OHM has only the whole western area, relation 2692239); Berlin is 2 regions instead of the 4 of #350"
  - id: vienna_sectors
    date: "1955-10-25"
    rr: C28
    not_drawn: "no PD, CC0 or CC BY source for the sector lines of Vienna was found (OHM has Wien only from 1955-07-27); Vienna is 1 region instead of the 5 of #350"
  - id: austria_zones_withdrawal
    date: "1955-10-25"
    rr: C27
    sets:
      - {name: soviet_zone, ids: ["austria_soviet_zone.*"]}
      - {name: us_zone, ids: ["austria_us_zone.*"]}
      - {name: british_zone, ids: ["austria_british_zone.*"]}
      - {name: french_zone, ids: ["austria_french_zone.*"]}
      - {name: vienna, ids: ["vienna.*"]}
  - id: porkkala_returned
    date: "1956-01-26"
    rr: C30
    sets:
      - {name: porkkala, ids: ["porkkala.*"]}
  - id: dodecanese_to_greece
    date: "1947-09-15"
    rr: C31
    sets:
      - {name: dodecanese, ids: ["dodecanese.*"]}
  - id: venezia_giulia_peace_treaty
    date: "1947-09-15"
    rr: "C16, C17"
    sets:
      - {name: ceded_to_yugoslavia, cuts: ["venezia_giulia_croatia:ceded", "venezia_giulia_slovenia:ceded"], except_ids: ["trieste_zone_b.*"]}
      - {name: zone_a, cuts: ["trieste_zone_a:zone_a"]}
      - {name: zone_b, cuts: ["trieste_zone_b:zone_b"]}
  - id: trieste_memorandum
    date: "1954-10-26"
    rr: "C14, C15"
    sets:
      - {name: zone_a, cuts: ["trieste_zone_a:zone_a"]}
      - {name: zone_b, cuts: ["trieste_zone_b:zone_b"]}
  - id: poland_ussr_border_exchange
    date: "1951-06-14"
    rr: B104
    not_drawn: "the exchange of about 480 km2 (Ustrzyki Dolne, Sokal salient) is smaller than a province and its line is in no acceptable source; no territory entry either: the area changed owner within existing provinces"
