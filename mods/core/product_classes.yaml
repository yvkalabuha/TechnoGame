# Product class jet_fighter (TASK-0011 product_class.md §1; spec slice-jet-aviation.md §1.4).
# perf = engine base × product of slot multipliers; prc_set of a design = union of the chosen
# alternatives' prc_set; complexity = sum of tier over prc_set. All multipliers are design
# parameters [assumption], estimated: true. Airframe alternatives are cumulative (F-PC1).
# requires_nodes: list = AND; {any_of: [...]} = alternative group (same form as node requires).
kind: product_class
define:
  - id: jet_fighter
    axis: perf
    # Tie order of slots when the "producible" variant lightens a slot (F-PC2); engine is never lightened.
    lighten_order: [hot_section, compressor, afterburner, airframe]
    slots:
      - id: engine
        base: true
        alternatives:
          - {id: eng_g1, rank: 1, perf_mult: 1.0, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g1]}
          - {id: eng_g2, rank: 2, perf_mult: 1.3, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g2]}
          - {id: eng_g3, rank: 3, perf_mult: 1.7, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g3]}
          - {id: eng_g4, rank: 4, perf_mult: 2.2, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbofan_g4]}
      - id: hot_section
        base: false
        alternatives:
          - {id: hot_nicr_forged, rank: 1, perf_mult: 1.0, prc_set: [s5.prc.nicr_alloy_melt, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_sa2_forged, rank: 2, perf_mult: 1.1, prc_set: [s5.prc.superalloy_melt_g2, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_vim_cast, rank: 3, perf_mult: 1.25, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ceramic_shell_moulding, s6.prc.investment_cast_blades], requires_nodes: [s8.cmp.turbine_blade_cast]}
          - {id: hot_vim_ds_cooled, rank: 4, perf_mult: 1.45, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ds_casting, s6.prc.cooled_blade_drilling], requires_nodes: [s8.cmp.turbine_blade_cooled]}
      - id: compressor
        base: false
        alternatives:
          - {id: comp_centrifugal, rank: 1, perf_mult: 1.0, prc_set: [s6.prc.centrifugal_impeller_machining], requires_nodes: []}
          - {id: comp_axial, rank: 2, perf_mult: 1.15, prc_set: [s6.prc.axial_compressor_machining], requires_nodes: [s8.cmp.axial_compressor_assembly]}
      - id: airframe
        base: false
        alternatives:
          - {id: af_straight, rank: 1, perf_mult: 1.0, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly], requires_nodes: [s8.eng.straight_wing_jet_airframe]}
          - {id: af_swept, rank: 2, perf_mult: 1.3, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication], requires_nodes: [s8.eng.swept_wing_airframe]}
          - {id: af_milled, rank: 3, perf_mult: 1.5, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}]}
          - {id: af_titanium, rank: 4, perf_mult: 1.6, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins, s5.prc.titanium_reduction_forging], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}, s5.cmp.titanium_alloy]}
      - id: afterburner
        base: false
        alternatives:
          - {id: ab_none, rank: 1, perf_mult: 1.0, prc_set: [], requires_nodes: []}
          - {id: ab_on, rank: 2, perf_mult: 1.15, prc_set: [s8.prc.afterburner_fabrication], requires_nodes: [s8.eng.afterburner, s8.cmp.afterburner_unit]}
    # ---- Product-layer inputs (docs/research/data/jet-slice/product_inputs.md; spec §3.3, contract §4.4).
    # Money is the budget index: 1 index per month = $100 M of 1950 (R-$, estimated). Rules are written
    # in the source before the numbers; every value below is estimated: true unless marked as a fact.
    # R-HPM (fact: BLS 1950, 40.51 h/week): hours per person-month, one value for all actors (estimated).
    h_pm: 175
    # R-WAGE = R-CH: full rate $10/h (1950) = 1e-7 index/h, stored per 1000 h because 1e-7 is below
    # one Fx6 raw unit (F-PI1): assembly_hours·wage = (assembly_hours·wage_kh)/1000.
    wage_kh: 0.0001
    # Engineers one bureau requests per month (spec §1.1 example "КБ в 500 чел."; no source found).
    bureau_engineers: 500
    # Upkeep divisor (no source; neutral).
    maintainability: 1.0
    # A18 reference line P0 rate, units per month (Meteor/Hunter order of magnitude).
    r_ref: 25
    # R-NP: n = 1 kit per product. R-LAB: mature direct hours per kit at yield 1 (split under the price
    # anchors of §2). R-BC: base_cost = labour_hours·c_h in index, floored to the Fx6 raw unit (so 225 h
    # gives 0.000022, not 0.0000225). Every PRC of an alternative needs exactly one row.
    processes:
      - {prc: s5.prc.light_alloy_rolling, n: 1, labour_hours: 600, base_cost: 0.00006}
      - {prc: s8.prc.stressed_skin_assembly, n: 1, labour_hours: 3700, base_cost: 0.00037}
      - {prc: s8.prc.swept_wing_fabrication, n: 1, labour_hours: 3450, base_cost: 0.000345}
      - {prc: s8.prc.machined_integral_skins, n: 1, labour_hours: 7500, base_cost: 0.00075}
      - {prc: s5.prc.titanium_reduction_forging, n: 1, labour_hours: 6750, base_cost: 0.000675}
      - {prc: s5.prc.alloying_element_refining, n: 1, labour_hours: 150, base_cost: 0.000015}
      - {prc: s8.prc.jet_engine_assembly_test, n: 1, labour_hours: 1350, base_cost: 0.000135}
      - {prc: s5.prc.nicr_alloy_melt, n: 1, labour_hours: 225, base_cost: 0.000022}
      - {prc: s5.prc.superalloy_melt_g2, n: 1, labour_hours: 600, base_cost: 0.00006}
      - {prc: s5.prc.vacuum_induction_melt, n: 1, labour_hours: 1800, base_cost: 0.00018}
      - {prc: s5.prc.high_purity_nickel_refining, n: 1, labour_hours: 225, base_cost: 0.000022}
      - {prc: s5.prc.ceramic_shell_moulding, n: 1, labour_hours: 1200, base_cost: 0.00012}
      - {prc: s6.prc.precision_blade_forging, n: 1, labour_hours: 750, base_cost: 0.000075}
      - {prc: s6.prc.investment_cast_blades, n: 1, labour_hours: 2250, base_cost: 0.000225}
      - {prc: s5.prc.ds_casting, n: 1, labour_hours: 3750, base_cost: 0.000375}
      - {prc: s6.prc.cooled_blade_drilling, n: 1, labour_hours: 5250, base_cost: 0.000525}
      - {prc: s6.prc.centrifugal_impeller_machining, n: 1, labour_hours: 450, base_cost: 0.000045}
      - {prc: s6.prc.axial_compressor_machining, n: 1, labour_hours: 1200, base_cost: 0.00012}
      - {prc: s8.prc.afterburner_fabrication, n: 1, labour_hours: 900, base_cost: 0.00009}
    # Per generation g (APP node of g). R-HF: h_floor = 0.25 × price target without GFE in hours,
    # h_first = h_floor/0.25. R-MF: materials_floor = GFE share × price in 1950 $ / M$. R-AK: alloy_kg =
    # engine mass (fact) × superalloy share × melt-loss factor 5. crew_req: display only (contract §4.6).
    # G4 anchor is F-105D (r2). R-PS proc_scale[g]: multiplier of the process part of unit_cost; R-DS
    # design_scale[g]: multiplier of W = W0·complexity (DAPCA IV check). Both are r2 proposals (F-PI5, F-PI6,
    # decision #78), values pending the r3 data update (money unit M$ = $80 M).
    generations:
      - {gen: 1, app: s8.app.jet_fighter_g1, h_first: 9320, h_floor: 2330, materials_floor: 0.000174, alloy_kg: 290, crew_req: 1, proc_scale: 0.94, design_scale: 1.00}
      - {gen: 2, app: s8.app.jet_fighter_g2, h_first: 14760, h_floor: 3690, materials_floor: 0.000264, alloy_kg: 670, crew_req: 1, proc_scale: 0.86, design_scale: 1.11}
      - {gen: 3, app: s8.app.jet_fighter_g3, h_first: 41960, h_floor: 10490, materials_floor: 0.000736, alloy_kg: 2120, crew_req: 1, proc_scale: 1.02, design_scale: 1.82}
      - {gen: 4, app: s8.app.jet_fighter_g4, h_first: 125900, h_floor: 31480, materials_floor: 0.001679, alloy_kg: 2980, crew_req: 1, proc_scale: 2.59, design_scale: 3.12}
