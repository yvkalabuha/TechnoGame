# Product class jet_fighter (TASK-0011 product_class.md §1; spec slice-jet-aviation.md §1.4).
# perf = engine base × product of slot multipliers; prc_set of a design = union of the chosen
# alternatives' prc_set; complexity = sum of tier over prc_set. All multipliers are design
# parameters [assumption], estimated: true. Airframe alternatives are cumulative (F-PC1).
# requires_nodes: list = AND; {any_of: [...]} = alternative group (same form as node requires).
kind: product_class
define:
  - id: jet_fighter
    axis: perf
    # Tie order of slots when the "producible" variant lightens a slot (F-PC2); engine is never lightened.
    lighten_order: [hot_section, compressor, afterburner, airframe]
    slots:
      - id: engine
        block: pu
        base: true
        alternatives:
          - {id: eng_g1, rank: 1, eng_gen: 1, perf_mult: 1.0, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g1]}
          - {id: eng_g2, rank: 2, eng_gen: 2, perf_mult: 1.3, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g2]}
          - {id: eng_g3, rank: 3, eng_gen: 3, perf_mult: 1.7, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g3]}
          - {id: eng_g4, rank: 4, eng_gen: 4, perf_mult: 2.2, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbofan_g4]}
      - id: hot_section
        block: pu
        base: false
        alternatives:
          # D1 (#131, spec v0.14 §1.4): the rank-0 "substitute" (uncooled steel blades, no alloy, short engine life). perf_mult 0.90 and
          # upkeep_mult 2.5 (= 0.5 + 0.5*4: engine share of upkeep x life ratio 25 h vs 100 h) are estimates without a source; PRC 47 is
          # the precision gear/bearing process every actor knows. max_eng_gen 1: G2 and above need the nickel alloy (node 30).
          - {id: hot_steel_g0, rank: 0, substitute: true, alloy_free: true, max_eng_gen: 1, upkeep_mult: 2.5, perf_mult: 0.90, prc_set: [s6.prc.precision_gear_bearing], requires_nodes: []}
          - {id: hot_nicr_forged, rank: 1, alloy_kg: 290, perf_mult: 1.0, prc_set: [s5.prc.nicr_alloy_melt, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_sa2_forged, rank: 2, alloy_kg: 670, perf_mult: 1.1, prc_set: [s5.prc.superalloy_melt_g2, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_vim_cast, rank: 3, alloy_kg: 2120, perf_mult: 1.25, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ceramic_shell_moulding, s6.prc.investment_cast_blades], requires_nodes: [s8.cmp.turbine_blade_cast]}
          - {id: hot_vim_ds_cooled, rank: 4, alloy_kg: 2980, perf_mult: 1.45, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ds_casting, s6.prc.cooled_blade_drilling], requires_nodes: [s8.cmp.turbine_blade_cooled]}
      - id: compressor
        block: pu
        base: false
        alternatives:
          - {id: comp_centrifugal, rank: 1, perf_mult: 1.0, prc_set: [s6.prc.centrifugal_impeller_machining], requires_nodes: []}
          - {id: comp_axial, rank: 2, perf_mult: 1.15, prc_set: [s6.prc.axial_compressor_machining], requires_nodes: [s8.cmp.axial_compressor_assembly]}
      - id: airframe
        block: af
        base: false
        alternatives:
          - {id: af_straight, rank: 1, af_class: 1, perf_mult: 1.0, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly], requires_nodes: [s8.eng.straight_wing_jet_airframe]}
          - {id: af_swept, rank: 2, af_class: 2, perf_mult: 1.3, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication], requires_nodes: [s8.eng.swept_wing_airframe]}
          - {id: af_milled, rank: 3, af_class: 3, perf_mult: 1.5, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}]}
          - {id: af_titanium, rank: 4, af_class: 3, perf_mult: 1.6, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins, s5.prc.titanium_reduction_forging], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}, s5.cmp.titanium_alloy]}
          - {id: af_mach2, rank: 5, af_class: 4, perf_mult: 1.8, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins, s5.prc.titanium_reduction_forging], requires_nodes: [s8.eng.mach2_airframe_g4, s5.cmp.titanium_alloy]}
      - id: afterburner
        block: pu
        base: false
        alternatives:
          - {id: ab_none, rank: 1, perf_mult: 1.0, prc_set: [], requires_nodes: []}
          - {id: ab_on, rank: 2, perf_mult: 1.15, prc_set: [s8.prc.afterburner_fabrication], requires_nodes: [s8.eng.afterburner, s8.cmp.afterburner_unit]}
    # ---- Product-layer inputs, revision r3 (docs/research/data/jet-slice/product_inputs.md §11; decision #78;
    # spec §3.3, §3.5 A28, contract §4.4). Money is the budget index: 1 index per month = $80 M of 1950 (R-$,
    # estimated). Rules are written in the source before the numbers; every value is estimated: true unless a fact.
    # R-HPM (fact: BLS 1950, 40.51 h/week): hours per person-month, one value for all actors (estimated).
    h_pm: 175
    # R-WAGE = R-CH: full rate 1.25e-7 index/h, stored per 1000 h because it is below one Fx6 raw unit (A28, F-PI1).
    wage_kh: 0.000125
    # Upkeep divisor (no source; neutral).
    maintainability: 1.0
    # A18 reference line P0 rate, units per month (Meteor/Hunter order of magnitude).
    r_ref: 25
    # R-NP: n_p = 1 kit per product. R-LAB: mature direct hours per kit at yield 1. R-BC: base_cost =
    # floor(labour_hours·c_h) in index raw (= floor(labour_hours·0.125) raw). Every PRC of an alternative needs one row.
    processes:
      - {prc: s5.prc.light_alloy_rolling, n_p: 1, labour_hours: 600, base_cost: 0.000075}
      - {prc: s8.prc.stressed_skin_assembly, n_p: 1, labour_hours: 3700, base_cost: 0.000462}
      - {prc: s8.prc.swept_wing_fabrication, n_p: 1, labour_hours: 3450, base_cost: 0.000431}
      - {prc: s8.prc.machined_integral_skins, n_p: 1, labour_hours: 7500, base_cost: 0.000937}
      - {prc: s5.prc.titanium_reduction_forging, n_p: 1, labour_hours: 6750, base_cost: 0.000843}
      - {prc: s5.prc.alloying_element_refining, n_p: 1, labour_hours: 150, base_cost: 0.000018}
      - {prc: s8.prc.jet_engine_assembly_test, n_p: 1, labour_hours: 1350, base_cost: 0.000168}
      - {prc: s5.prc.nicr_alloy_melt, n_p: 1, labour_hours: 225, base_cost: 0.000028}
      - {prc: s5.prc.superalloy_melt_g2, n_p: 1, labour_hours: 600, base_cost: 0.000075}
      - {prc: s5.prc.vacuum_induction_melt, n_p: 1, labour_hours: 1800, base_cost: 0.000225}
      - {prc: s5.prc.high_purity_nickel_refining, n_p: 1, labour_hours: 225, base_cost: 0.000028}
      - {prc: s5.prc.ceramic_shell_moulding, n_p: 1, labour_hours: 1200, base_cost: 0.00015}
      - {prc: s6.prc.precision_blade_forging, n_p: 1, labour_hours: 750, base_cost: 0.000093}
      - {prc: s6.prc.investment_cast_blades, n_p: 1, labour_hours: 2250, base_cost: 0.000281}
      - {prc: s5.prc.ds_casting, n_p: 1, labour_hours: 3750, base_cost: 0.000468}
      - {prc: s6.prc.cooled_blade_drilling, n_p: 1, labour_hours: 5250, base_cost: 0.000656}
      - {prc: s6.prc.centrifugal_impeller_machining, n_p: 1, labour_hours: 450, base_cost: 0.000056}
      - {prc: s6.prc.axial_compressor_machining, n_p: 1, labour_hours: 1200, base_cost: 0.00015}
      - {prc: s8.prc.afterburner_fabrication, n_p: 1, labour_hours: 900, base_cost: 0.000112}
      - {prc: s6.prc.precision_gear_bearing, n_p: 1, labour_hours: 300, base_cost: 0.000037}
    # c_ref: complexity of the reference superior G2 project (contract §4.4b: D_ref = d0·c_ref); data, not calibrated.
    c_ref: 37
    # R-PS2m (product_inputs.md r4 §14.3): process part = ((ΣPU·U_PU)·proc_scale_pu[r_PU]) + ((ΣAF·U_AF)·proc_scale_af[af_class]);
    # r_PU = max rank over the PU slots (engine, hot_section, compressor, afterburner). Monotone envelope, exact references.
    pu_ranks:
      - {rank: 1, proc_scale_pu: 0.515528}
      - {rank: 2, proc_scale_pu: 0.515528}
      - {rank: 3, proc_scale_pu: 0.827491}
      - {rank: 4, proc_scale_pu: 0.827491}
    # Airframe-class fields (§14.4; contract §4.4a). R-HF: h_floor = 0.25 × price target without GFE in hours, h_first =
    # 4·h_floor. R-MF: materials_floor = GFE share × price. R-DS design_scale: W = W0·complexity·design_scale/(1 + bureau_exp/E_B)
    # (#78). Bureau staff bureau_req = floor(B0·design_scale^κ) is a calibration parameter, not mod data (spec §3.5 A34).
    af_classes:
      - {af_class: 1, h_first: 9320, h_floor: 2330, materials_floor: 0.000217, design_scale: 1.00, proc_scale_af: 1.253259}
      - {af_class: 2, h_first: 14760, h_floor: 3690, materials_floor: 0.000329, design_scale: 1.11, proc_scale_af: 1.086777}
      - {af_class: 3, h_first: 41960, h_floor: 10490, materials_floor: 0.000919, design_scale: 1.82, proc_scale_af: 1.098982}
      - {af_class: 4, h_first: 125920, h_floor: 31480, materials_floor: 0.002098, design_scale: 3.12, proc_scale_af: 3.754003}
    # Per generation g: APP node, crew_req (display only, contract §4.6), platform threshold (contract §4.4a):
    # g_p(d) = max{g : APP_g known ∧ rank(airframe) >= platform_min_rank[g]}.
    generations:
      - {gen: 1, app: s8.app.jet_fighter_g1, crew_req: 1, platform_min_rank: 1}
      - {gen: 2, app: s8.app.jet_fighter_g2, crew_req: 1, platform_min_rank: 2}
      - {gen: 3, app: s8.app.jet_fighter_g3, crew_req: 1, platform_min_rank: 3}
      - {gen: 4, app: s8.app.jet_fighter_g4, crew_req: 1, platform_min_rank: 5}
