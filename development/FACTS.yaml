# Known facts of the project, checked by tools/development/kb_check.py.
#
# Each fact has a plain statement and its source. A fact may have:
#   probe          how to verify it against the source of truth (a file in the repository):
#                    {file, regex, expect}   first capture group of the regex must equal expect
#                    {file, count, expect}   number of lines matching the regex `count`
#   stale_patterns regexes that contradict the fact; kb_check flags them in the living documents
#                  (CLAUDE.md, CURRENT_STATE.md, PLAN, ROADMAP, open milestones, rules, agents, skills,
#                  ARCHITECTURE, the vision, the UI design system, the M-play loop)
#   keywords       words that make the fact show up in `kb_check.py related "<text>"`
#
# When a probe fails, either the code changed (update the fact and every document that states it)
# or the fact was wrong. Add a fact whenever a wrong number or an outdated claim reaches a document.
facts:
  - id: campaign-years
    statement: "Основная кампания идёт с 1945 года; горизонт игры 1945–2100. Старт 1910 отменён."
    source: "DECISIONS_LOG #23"
    stale_patterns: ['1910[–-]2100', 'simulator 1910']
    keywords: [1945, 1910, кампания, старт, горизонт]

  - id: slice-actors
    statement: "В срезе «реактивная авиация» 5 акторов: USA, GBR, SUN, FRA, SWE."
    source: "src/Singularity.Client.Spike/Names.cs; SliceChecks.cs"
    reviewed: 2026-11-26
    probe: {file: "src/Singularity.Client.Spike/Names.cs", regex: '\["USA"\].*\["GBR"\].*\["SUN"\].*\["FRA"\].*\["(SWE)"\]', expect: "SWE"}
    stale_patterns: ['8 держав']
    keywords: [срез, актор, держав, страны, стран, USA, SWE]

  - id: slice-horizon
    statement: "Срез считает 86 лет: с 1945 до декабря 2030 (TASK-0121, #423). Узлы 1990–2030 (55 шт., TASK-0193) одобрены, но ждут пакета изменений, меняющих эталоны (пауза #595)."
    source: "src/Singularity.Session/Slice/SliceWorld.cs; development/tasks/TASK-0193*"
    reviewed: 2026-11-26
    probe: {file: "src/Singularity.Session/Slice/SliceWorld.cs", regex: 'const int Years = (\d+);', expect: "86"}
    stale_patterns: ['срез обрывается в январе 1978', 'Years = 33', 'поколений после G4 в данных ещё нет']
    keywords: [горизонт, 2030, 1978, партия, длина, лет]
  - id: slice-content
    statement: "В main 156 узлов знаний (mods/core/nodes.yaml), поколения G1–G6; ещё 55 узлов 1990–2030 — на ветке TASK-0193."
    source: "mods/core/nodes.yaml"
    reviewed: 2026-11-26
    probe: {file: "mods/core/nodes.yaml", count: '^\s*- \{?id:', expect: 156}
    stale_patterns: ['61 узел знаний', 'новые знания кончаются к 1961']
    keywords: [узл, поколени, G4, G5, G6, знани, контент, дерево]
  - id: schema-version
    statement: "SchemaVersion состояния среза — 15."
    source: "src/Singularity.Session/Slice/SliceWorld.cs"
    reviewed: 2026-11-26
    probe: {file: "src/Singularity.Session/Slice/SliceWorld.cs", regex: 'const int SchemaVersion = (\d+);', expect: "15"}
    keywords: [SchemaVersion, схем, golden, хеш]
  - id: api-version
    statement: "Версия тестового API сессии (TestApiVersion) в main — 28 (ветка карты TASK-0192/0194 — 29)."
    source: "src/Singularity.Session/SliceSession.cs"
    reviewed: 2026-11-26
    probe: {file: "src/Singularity.Session/SliceSession.cs", regex: 'const int TestApiVersion = (\d+);', expect: "28"}
    keywords: [TestApiVersion, API, surface]
  - id: map-regions
    statement: "Карта мира 1945: 3124 провинции, 379 регионов. Предел предупреждения — 400 регионов (ADR-0022)."
    source: "mods/core/map/regions.yaml"
    reviewed: 2026-11-26
    probe: {file: "mods/core/map/regions.yaml", count: '^  - \{id: ', expect: "379"}
    stale_patterns: ['373 региона', '374 региона', '150[–-]250 регион']
    keywords: [регион, провинци, карта, 400, квот]

  - id: milestones
    statement: "M0 закрыт (#419). Идёт M-play (MS-M05) на новой модели науки (#561–#578). С 2026-11-26 разработка продукта на паузе до окончания изменений платформы (#595). M1 — после партии владельца."
    source: "DECISIONS_LOG #418–#420, #561, #595; development/PLAN.md"
    stale_patterns: ['MS-M0, закрытие', 'Сейчас идёт \*\*MS-M0\*\*']
    keywords: [M0, M1, M-play, этап, milestone, отложен, пауза]
  - id: benchmark
    statement: "Замер тика M0: EXP-0007, исход INCONCLUSIVE, цифры — справка. Решающий замер — на мире M1. EXP-0008 и ADR-0024 отложены, харнесс заморожен (#419)."
    source: "DECISIONS_LOG #405, #419"
    stale_patterns: ['EXP-0008 calibration ready', 'готов к калибровке']
    keywords: [замер, бенчмарк, EXP-0007, EXP-0008, тик, серия, калибровк]

  - id: screen
    statement: "Игра идёт во весь экран или окном без рамок; минимальный экран — Full HD 1920x1080; меньшие окна только для тестов (#424, #425)."
    source: "DECISIONS_LOG #424, #425; docs/ui/UI_DESIGN_SYSTEM.md §4.3"
    stale_patterns: ['1280x720 and 1920x1080']
    keywords: [экран, окно, 1280, 1920, масштаб, fullscreen, полный экран]

  - id: m-play-loop
    statement: "Цель партии — военное превосходство: «воздушная мощь» к лучшему сопернику, ступени паритет 1,0 / превосходство 1,5 / господство 2,0, засчитывается после 60 месяцев удержания (#565, O-109). Цель «догоняние» (#422) заменена; горизонт 1945–2030, пять стран."
    source: "DECISIONS_LOG #565; docs/decisions/ORCH_DECISIONS.md O-109"
    stale_patterns: ['цель — догоняние', 'ранг выше стартового']
    keywords: [цель, победа, поражение, партия, догонян, ранг, воздушн, мощь, превосходство]
  - id: second-review
    statement: "Дифф ядра (Kernel, Core, Session, их тесты, golden, проектные файлы) и tools/** проходит второе ревью Codex до слияния (ADR-0015); land.py запускает его сам."
    source: "ADR-0015; tools/development/land.py"
    keywords: [Codex, ревью, review, слияни, land, DeepSeek]

  - id: decision-levels
    statement: "Крупные решения (направление, объём, необратимое, дороже дня работы) принимает владелец; мелкие обратимые — Orchestrator с записью в ORCH_DECISIONS.md (#421)."
    source: "DECISIONS_LOG #421"
    keywords: [D1, D2, ORCH_DECISIONS, уровень решени]

  - id: data-licences
    statement: "Внешние данные и ассеты — только PD, CC0 или CC BY (ADR-0009)."
    source: "ADR-0009"
    keywords: [лицензи, CC, ассет, текстур, музык, звук]

  - id: m-play-budgets
    statement: "Бюджеты стран в M-play считаются правилом условной сходимости (#165, #430), настроенным по истории; исторические ряды в игру не подаются. Постоянный рост `growth_pa` отменён."
    source: "DECISIONS_LOG #165, #430; docs/simulation/m-play-horizon-2030.md"
    keywords: [бюджет, рост, сходимост, сближен, growth, ВВП, эпох]

  - id: fleet-retirement
    statement: "Парк без замены по возрасту не списывается: старые самолёты служат до прихода следующего поколения и стареют (#431, развивает #141)."
    source: "DECISIONS_LOG #141, #431"
    keywords: [парк, списан, самолёт, замен, retire, когорт]

  - id: science-slots
    statement: "Наука по слотам (#561–#576): один институт — одна тема, очередь активная + 5, ускорение за деньги, общий потолок ускорения ×2,5, 13 направлений с уровнями."
    source: "src/Singularity.Core/Institutes/SlotParams.cs; docs/game-design/SCIENCE_SLOTS.md"
    reviewed: 2026-11-26
    probe: {file: "src/Singularity.Core/Institutes/SlotParams.cs", regex: 'QueueLength \{ get; init; \} = (\d+);', expect: "5"}
    stale_patterns: ['распределение ресурсов по направлениям']
    keywords: [институт, слот, очередь, фокус, ускорение, направлени, наука]

  - id: institutes-count
    statement: "В mods/core/institutes.yaml 27 институтов-кандидатов (до 1961); 31 кандидат 1960–2016 — на ветке TASK-0205 (пауза #595)."
    source: "mods/core/institutes.yaml"
    reviewed: 2026-11-26
    probe: {file: "mods/core/institutes.yaml", count: '^\s*- \{id:', expect: 27}
    keywords: [институт, кандидат, стройка, 1960, 1990]

  - id: product-pause
    statement: "Пауза продукта (#595, с 2026-11-26) снята владельцем 2026-11-28 (#617): полоса A — новая модель науки, платформа — полоса B."
    source: "DECISIONS_LOG #595, #617; development/PLAN.md"
    keywords: [пауза, продукт, платформа, новые задачи]

  - id: tools-codex-rule
    statement: "Служебные инструменты (tools/development, .claude/hooks, skills) вливаются после 3 кругов Codex с одобрением рецензента (#592); находки о разрушительных или необратимых действиях не снимаются. Ядро и игра — #432."
    source: "DECISIONS_LOG #592, #432"
    keywords: [Codex, второе ревью, круг, инструмент, влить]
