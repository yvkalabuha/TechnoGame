# Ownership-event lines (RR-0020, ADR-0020 §2.9, #350): the provinces of a set change owner or controller together, so every region lies
# wholly in one set or wholly outside it. The CI check of 'MapBuilder build' fails on a region that crosses a line.
# Selectors must not depend on the region a province ended up in: use 'codes' (NE adm1 codes the province was made from, Piece.Src), 'adm0' or 'cuts'
# ("cut_id:piece"). 'ids' is for territories without a source piece; a region id prefix would make the check tautological.
# The German zones are approximated by modern Laender (Hesse, Lower Saxony, NRW, Rhineland-Palatinate do not follow the zone borders exactly), except the cut zones.
# A set selects provinces by 'adm0' (NE country), 'ids' (a trailing * is a prefix) or 'cuts' ("cut_id:piece" of a cut in spec/20-cuts-*.yaml).
# 'not_drawn' records a line that is not on the map and why (printed by the build).
events:
  - id: kaliningrad_soviet
    date: "1946-04-07"
    rr: C01
    sets:
      - {name: kaliningrad, codes: [RUS-2324]}
  - id: saar_protectorate
    date: "1947-12-17"
    rr: C02
    sets:
      - {name: saar, codes: [DEU-1581]}
  - id: saar_to_frg
