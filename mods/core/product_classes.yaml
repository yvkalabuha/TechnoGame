# Product class jet_fighter (TASK-0011 product_class.md §1; spec slice-jet-aviation.md §1.4).
# perf = engine base × product of slot multipliers; prc_set of a design = union of the chosen
# alternatives' prc_set; complexity = sum of tier over prc_set. All multipliers are design
# parameters [assumption], estimated: true. Airframe alternatives are cumulative (F-PC1).
# requires_nodes: list = AND; {any_of: [...]} = alternative group (same form as node requires).
kind: product_class
define:
  - id: jet_fighter
    axis: perf
    # Tie order of slots when the "producible" variant lightens a slot (F-PC2); engine is never lightened.
    lighten_order: [hot_section, compressor, afterburner, airframe]
    slots:
      - id: engine
        base: true
        alternatives:
          - {id: eng_g1, rank: 1, perf_mult: 1.0, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g1]}
          - {id: eng_g2, rank: 2, perf_mult: 1.3, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g2]}
          - {id: eng_g3, rank: 3, perf_mult: 1.7, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbojet_g3]}
          - {id: eng_g4, rank: 4, perf_mult: 2.2, prc_set: [s8.prc.jet_engine_assembly_test, s5.prc.alloying_element_refining], requires_nodes: [s8.eng.turbofan_g4]}
      - id: hot_section
        base: false
        alternatives:
          - {id: hot_nicr_forged, rank: 1, perf_mult: 1.0, prc_set: [s5.prc.nicr_alloy_melt, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_sa2_forged, rank: 2, perf_mult: 1.1, prc_set: [s5.prc.superalloy_melt_g2, s5.prc.high_purity_nickel_refining, s6.prc.precision_blade_forging], requires_nodes: [s5.cmp.heat_resistant_alloy, s8.cmp.turbine_blade_forged]}
          - {id: hot_vim_cast, rank: 3, perf_mult: 1.25, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ceramic_shell_moulding, s6.prc.investment_cast_blades], requires_nodes: [s8.cmp.turbine_blade_cast]}
          - {id: hot_vim_ds_cooled, rank: 4, perf_mult: 1.45, prc_set: [s5.prc.vacuum_induction_melt, s5.prc.ds_casting, s6.prc.cooled_blade_drilling], requires_nodes: [s8.cmp.turbine_blade_cooled]}
      - id: compressor
        base: false
        alternatives:
          - {id: comp_centrifugal, rank: 1, perf_mult: 1.0, prc_set: [s6.prc.centrifugal_impeller_machining], requires_nodes: []}
          - {id: comp_axial, rank: 2, perf_mult: 1.15, prc_set: [s6.prc.axial_compressor_machining], requires_nodes: [s8.cmp.axial_compressor_assembly]}
      - id: airframe
        base: false
        alternatives:
          - {id: af_straight, rank: 1, perf_mult: 1.0, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly], requires_nodes: [s8.eng.straight_wing_jet_airframe]}
          - {id: af_swept, rank: 2, perf_mult: 1.3, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication], requires_nodes: [s8.eng.swept_wing_airframe]}
          - {id: af_milled, rank: 3, perf_mult: 1.5, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}]}
          - {id: af_titanium, rank: 4, perf_mult: 1.6, prc_set: [s5.prc.light_alloy_rolling, s8.prc.stressed_skin_assembly, s8.prc.swept_wing_fabrication, s8.prc.machined_integral_skins, s5.prc.titanium_reduction_forging], requires_nodes: [{any_of: [s8.eng.area_ruled_airframe, s8.eng.delta_wing_airframe]}, s5.cmp.titanium_alloy]}
      - id: afterburner
        base: false
        alternatives:
          - {id: ab_none, rank: 1, perf_mult: 1.0, prc_set: [], requires_nodes: []}
          - {id: ab_on, rank: 2, perf_mult: 1.15, prc_set: [s8.prc.afterburner_fabrication], requires_nodes: [s8.eng.afterburner, s8.cmp.afterburner_unit]}
    # ---- Product-layer inputs, revision r3 (docs/research/data/jet-slice/product_inputs.md §11; decision #78;
    # spec §3.3, §3.5 A28, contract §4.4). Money is the budget index: 1 index per month = $80 M of 1950 (R-$,
    # estimated). Rules are written in the source before the numbers; every value is estimated: true unless a fact.
    # R-HPM (fact: BLS 1950, 40.51 h/week): hours per person-month, one value for all actors (estimated).
    h_pm: 175
    # R-WAGE = R-CH: full rate 1.25e-7 index/h, stored per 1000 h because it is below one Fx6 raw unit (A28, F-PI1).
    wage_kh: 0.000125
    # Upkeep divisor (no source; neutral).
    maintainability: 1.0
    # A18 reference line P0 rate, units per month (Meteor/Hunter order of magnitude).
    r_ref: 25
    # R-NP: n_p = 1 kit per product. R-LAB: mature direct hours per kit at yield 1. R-BC: base_cost =
    # floor(labour_hours·c_h) in index raw (= floor(labour_hours·0.125) raw). Every PRC of an alternative needs one row.
    processes:
      - {prc: s5.prc.light_alloy_rolling, n_p: 1, labour_hours: 600, base_cost: 0.000075}
      - {prc: s8.prc.stressed_skin_assembly, n_p: 1, labour_hours: 3700, base_cost: 0.000462}
      - {prc: s8.prc.swept_wing_fabrication, n_p: 1, labour_hours: 3450, base_cost: 0.000431}
      - {prc: s8.prc.machined_integral_skins, n_p: 1, labour_hours: 7500, base_cost: 0.000937}
      - {prc: s5.prc.titanium_reduction_forging, n_p: 1, labour_hours: 6750, base_cost: 0.000843}
      - {prc: s5.prc.alloying_element_refining, n_p: 1, labour_hours: 150, base_cost: 0.000018}
      - {prc: s8.prc.jet_engine_assembly_test, n_p: 1, labour_hours: 1350, base_cost: 0.000168}
      - {prc: s5.prc.nicr_alloy_melt, n_p: 1, labour_hours: 225, base_cost: 0.000028}
      - {prc: s5.prc.superalloy_melt_g2, n_p: 1, labour_hours: 600, base_cost: 0.000075}
      - {prc: s5.prc.vacuum_induction_melt, n_p: 1, labour_hours: 1800, base_cost: 0.000225}
      - {prc: s5.prc.high_purity_nickel_refining, n_p: 1, labour_hours: 225, base_cost: 0.000028}
      - {prc: s5.prc.ceramic_shell_moulding, n_p: 1, labour_hours: 1200, base_cost: 0.00015}
      - {prc: s6.prc.precision_blade_forging, n_p: 1, labour_hours: 750, base_cost: 0.000093}
      - {prc: s6.prc.investment_cast_blades, n_p: 1, labour_hours: 2250, base_cost: 0.000281}
      - {prc: s5.prc.ds_casting, n_p: 1, labour_hours: 3750, base_cost: 0.000468}
      - {prc: s6.prc.cooled_blade_drilling, n_p: 1, labour_hours: 5250, base_cost: 0.000656}
      - {prc: s6.prc.centrifugal_impeller_machining, n_p: 1, labour_hours: 450, base_cost: 0.000056}
      - {prc: s6.prc.axial_compressor_machining, n_p: 1, labour_hours: 1200, base_cost: 0.00015}
      - {prc: s8.prc.afterburner_fabrication, n_p: 1, labour_hours: 900, base_cost: 0.000112}
    # Per generation g (APP node of g). R-HF: h_floor = 0.25 × price target without GFE in hours, h_first =
    # 4·h_floor. R-MF: materials_floor = GFE share × price in 1950 $ / M$. R-AK: alloy_kg = engine mass (fact) ×
    # superalloy share × melt-loss factor 5. crew_req: display only (contract §4.6). R-PS proc_scale: multiplier of
    # the process part of unit_cost; R-DS design_scale: W = W0·complexity·design_scale/(1 + bureau_exp/E_B) (#78).
    # bureau_engineers: engineers one bureau requests per month (spec §1.1 "КБ в 500 чел."; no source); a scaling
    # rule R-BS floor(500·sqrt(design_scale)) is pending (F-PI8), so 500 for every generation for now.
    generations:
      - {gen: 1, app: s8.app.jet_fighter_g1, h_first: 9320, h_floor: 2330, materials_floor: 0.000217, alloy_kg: 290, crew_req: 1, proc_scale: 0.942188, design_scale: 1.00, bureau_engineers: 500}
      - {gen: 2, app: s8.app.jet_fighter_g2, h_first: 14760, h_floor: 3690, materials_floor: 0.000329, alloy_kg: 670, crew_req: 1, proc_scale: 0.858987, design_scale: 1.11, bureau_engineers: 500}
      - {gen: 3, app: s8.app.jet_fighter_g3, h_first: 41960, h_floor: 10490, materials_floor: 0.000919, alloy_kg: 2120, crew_req: 1, proc_scale: 1.021118, design_scale: 1.82, bureau_engineers: 500}
      - {gen: 4, app: s8.app.jet_fighter_g4, h_first: 125920, h_floor: 31480, materials_floor: 0.002098, alloy_kg: 2980, crew_req: 1, proc_scale: 2.597030, design_scale: 3.12, bureau_engineers: 500}
