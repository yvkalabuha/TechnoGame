name: CI

on:
  push:
    branches: [main, 'llm/**']
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Registry check
        run: |
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            python tools/development/registry.py check --against "$BASE"
          else
            python tools/development/registry.py check
          fi
      - name: Hook self-test
        run: python tools/development/test_hooks.py
      # Living documents must not cite ids that do not exist; fact drift and stale claims print as warnings.
      - name: Knowledge base check
        run: python tools/development/kb_check.py check

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Singularity.sln -c Release
      # Unit, architecture and determinism (L1/L2 hash) tests: a hash mismatch fails a test.
      - name: Test
        run: dotnet test Singularity.sln -c Release --no-build
      - name: Lab self-test
        run: dotnet src/Singularity.Lab/bin/Release/net10.0/Singularity.Lab.dll selftest
      # ADR-0006: empty day < 1 ms (DEBT-0010); Linux only, other runners are too noisy for a timing bound.
      - name: Empty-tick benchmark
        if: runner.os == 'Linux'
        env:
          SINGULARITY_BENCH: "1"
        run: dotnet test tests/Singularity.Kernel.Tests/Singularity.Kernel.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~EmptyTickBudget"

  # Map builder (TASK-0075, DEBT-0043): package graph without LGPL, unit tests,
  # and byte-identical rebuild when the pinned sources are available.
  map-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Package graph (no LGPL modules)
        run: bash tools/map/check_packages.sh
      - name: Cache pinned map sources
        id: map-cache
        uses: actions/cache@v4
        with:
          path: tools/map/.cache
          key: map-sources-${{ hashFiles('tools/map/sources.lock.yaml') }}
      - name: Fetch pinned map sources
        id: map-fetch
        if: steps.map-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: dotnet run -c Release --project tools/map/MapBuilder -- fetch
      - name: Build geo/arcs.bin (the client map tests read it, TASK-0138)
        id: geo
        if: steps.map-cache.outputs.cache-hit == 'true' || steps.map-fetch.outcome == 'success'
        continue-on-error: true
        env:
          SINGULARITY_MAP_CACHE: ${{ github.workspace }}/tools/map/.cache
        run: python3 tools/map/ensure_geo.py
      - name: MapBuilder tests
        env:
          SINGULARITY_GEO_OPTIONAL: ${{ steps.geo.outcome != 'success' && '1' || '' }}
        run: dotnet test tests/Singularity.MapBuilder.Tests -c Release
      - name: Determinism (two builds byte-identical, equal to committed tables)
        if: steps.map-cache.outputs.cache-hit == 'true' || steps.map-fetch.outcome == 'success'
        run: bash tools/map/check_determinism.sh
      - name: Determinism skipped
        if: steps.map-cache.outputs.cache-hit != 'true' && steps.map-fetch.outcome != 'success'
        run: echo "::warning::map sources unavailable; check_determinism.sh skipped"

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analysis tests
        run: python -m unittest discover -s lab/analysis -p "test_*.py"

  llm-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML for the risk classifier (approval fields)
        working-directory: ${{ runner.temp }}
        run: python -P -m pip install --quiet pyyaml==6.0.2
      # Risk class runs before any branch code; -P keeps the branch checkout (cwd) off sys.path (TASK-0039 review)
      - name: Risk class of llm/* branches (classifier and paths from main; no merge above R1)
        if: startsWith(github.head_ref, 'llm/') || startsWith(github.ref_name, 'llm/')
        run: |
          git fetch origin main
          K="$RUNNER_TEMP/rk/llm_worker"
          mkdir -p "$K"
          touch "$K/__init__.py"
          for f in risk.py paths.py risk_paths.json; do
            git show "origin/main:tools/llm_worker/$f" > "$K/$f"
          done
          PYTHONPATH="$RUNNER_TEMP/rk" python -P -m llm_worker.risk classify \
            --range "origin/main...${{ github.event.pull_request.head.sha || github.sha }}" \
            --paths-file "$K/risk_paths.json" --max R1
      # bwrap, dotnet-in-sandbox and gitleaks tests skip themselves when the tools are unavailable
      - name: llm_worker unit tests
        run: python -m unittest discover -s tools/llm_worker/tests
