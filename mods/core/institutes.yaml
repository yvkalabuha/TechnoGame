# country = actor ID of the scenario; areas = discipline: level 1..4 [estimate, calibrated in Lab]. ref_year = the historical year (the price of a later project).
# Rows with founded after the start of the scenario are build candidates (BuildInstitute); their levels are estimates, and for a small country (FRA, SWE) the sum of levels of a project is at most 3.
