        hcap: 5.50
        w: 1.0
        known: [s7.fnd.brayton_cycle, s8.fnd.boundary_layer, s8.fnd.compressible_flow, s5.fnd.precipitation_hardening, s8.prn.gas_turbine, s8.prn.swept_wing, s8.prn.afterburning, s8.eng.turbojet_g1, s8.eng.straight_wing_jet_airframe, s5.cmp.heat_resistant_alloy, s5.cmp.aluminium_alloy_sheet, s8.cmp.turbine_blade_forged, s5.prc.light_alloy_rolling, s5.prc.nicr_alloy_melt, s5.prc.alloying_element_refining, s5.prc.high_purity_nickel_refining, s6.prc.precision_gear_bearing, s6.prc.centrifugal_impeller_machining, s6.prc.precision_blade_forging, s8.prc.stressed_skin_assembly, s8.prc.jet_engine_assembly_test, s8.app.jet_fighter_g1]
